name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Comprobar tipos
        run: npx tsc --noEmit
      - name: Pruebas unitarias
        run: npm run test:ci
        env:
          CI: true
      - name: Build de producción
        run: npm run build
        env:
          CI: false # CRA trata los warnings como errores con CI=true
